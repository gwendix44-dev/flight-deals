name: cleanup-issues
on:
  workflow_dispatch: {}
permissions:
  issues: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Fermer les Issues d'offres ouvertes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
          done

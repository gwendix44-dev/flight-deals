name: cleanup-issues
# À lancer UNE fois à la main : ferme toutes les anciennes Issues d'alerte (étiquettes de l'appli uniquement).
on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fermer les anciennes alertes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m flightdeals.cleanup

name: feedback
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  learn:
    # UNIQUEMENT le propriétaire du dépôt (sécurité), et seulement pour les refus / commandes
    if: >-
      github.actor == github.repository_owner &&
      ((github.event_name == 'issues' && (startsWith(github.event.issue.title, 'Refus') || startsWith(github.event.issue.title, 'Commande'))) ||
       (github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apprendre du refus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python -m flightdeals.feedback
      - name: Enregistrer l'état
        run: |
          git config user.name "flight-deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -m "feedback: refus pris en compte"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q && git push -q && exit 0
            sleep $((i * 4))
          done
          exit 1

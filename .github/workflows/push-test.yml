name: push-test
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Notification de test
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          python - <<'PY'
          from flightdeals.notify import send_push
          ok = send_push("✅ Test Flight Deals", "Si tu lis ça, les notifications marchent.", tag="test")
          raise SystemExit(0 if ok else 1)
          PY

name: scan-combos
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  combos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montages d'escales
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python -m flightdeals.scan_combos
      - name: Enregistrer l'état
        if: always()
        run: |
          git config user.name "flight-deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -m "combos: état mis à jour"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q && git push -q && exit 0
            sleep $((i * 4))
          done
          exit 0

name: scan-combos
on:
  schedule:
    - cron: "10 */3 * * *"   # toutes les 3 h : beaucoup plus de requêtes que le scan classique
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: scan          # même groupe que scan-flights : jamais en parallèle (évite les conflits de commit)
  cancel-in-progress: false

jobs:
  combos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan montages d'escales
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m flightdeals.combos
      - name: Save state
        run: |
          git config user.name "flight-deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen.json data/alerts_log.json docs/deals.json
          git diff --cached --quiet || (git commit -m "combos: update state" && git pull --rebase -q && git push)

name: scan-flights
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub n'en exécute en pratique qu'environ 1 par heure : le code tolère ce retard
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: python -m flightdeals.main
      - name: Enregistrer l'état
        if: always()
        run: |
          git config user.name "flight-deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -m "scan: état mis à jour"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q && git push -q && exit 0
            echo "push refusé (essai $i)"; sleep $((i * 4))
          done
          echo "::warning::état non enregistré (conflit de push)"; exit 0

name: scan-flights
on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m flightdeals.main
      - name: Save state
        run: |
          git config user.name "flight-deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json data/seen.json docs/deals.json
          git diff --cached --quiet || (git commit -m "scan: update deals" && git pull --rebase -q && git push)

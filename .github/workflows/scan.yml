name: scan-flights
on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances (notifications natives)
        run: pip install -r requirements.txt
      - name: Scan
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: python -m flightdeals.main
      - name: Save state
        if: always()
        run: |
          git config user.name "flight-deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -m "scan: update state"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q && git push -q && exit 0
            echo "push refusé (tentative $i), nouvel essai"; sleep $((i * 4))
          done
          echo "::warning::l'état n'a pas pu être enregistré (conflit de push)"; exit 0

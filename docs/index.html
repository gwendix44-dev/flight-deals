<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1d33">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flight Deals">
<title>Flight Deals</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f7fa; --card:#fff; --fg:#10202f; --mut:#5b6b7b; --acc:#0b6bcb; --err:#c62828; --bus:#6a1b9a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1d33; --card:#132a45; --fg:#e8eef5; --mut:#9fb2c6; --acc:#5aa9ff; --err:#ff6b6b; --bus:#c58bff; } }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  h1 { margin:0; font-size:1.3rem; }
  .mut { color:var(--mut); font-size:.85rem; }
  nav { padding:0 16px 8px; display:flex; gap:8px; flex-wrap:wrap; }
  nav button { border:1px solid var(--mut); background:transparent; color:var(--fg); border-radius:20px; padding:6px 14px; cursor:pointer; }
  nav button[aria-pressed="true"] { background:var(--acc); border-color:var(--acc); color:#fff; }
  main { padding:8px 16px 32px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  article { background:var(--card); border-radius:12px; padding:14px; border-left:5px solid var(--acc); }
  article.error_fare { border-color:var(--err); } article.business_deal { border-color:var(--bus); } article.stopover_deal { border-color:#ef6c00; }
  .itin { font-size:.85rem; margin:6px 0; padding-left:10px; border-left:2px solid var(--mut); } .itin div { margin:2px 0; }
  .tag { font-size:.75rem; font-weight:700; text-transform:uppercase; }
  .error_fare .tag { color:var(--err); } .business_deal .tag { color:var(--bus); } .stopover_deal .tag { color:#ef6c00; }
  .score { float:right; background:var(--acc); color:#fff; border-radius:12px; padding:2px 10px; font-size:.85rem; }
  .grid { font-size:.78rem; color:var(--mut); margin-top:4px; }
  details.costs { font-size:.85rem; margin:6px 0; } details.costs div { margin:2px 0 2px 10px; }
  .verif { font-size:.8rem; color:#2e7d32; margin:4px 0; }
  .price { font-size:1.6rem; font-weight:700; } .tot { font-weight:600; }
  .warn { color:#b26a00; font-size:.85rem; } a.btn { display:inline-block; margin-top:8px; padding:8px 14px; background:var(--acc); color:#fff; border-radius:8px; text-decoration:none; }
  .refuse { margin-left:8px; padding:8px 12px; border-radius:8px; border:1px solid var(--mut); background:transparent; color:var(--fg); cursor:pointer; }
  .rform { margin-top:10px; } .rform[hidden] { display:none; }
  .rform textarea { width:100%; box-sizing:border-box; min-height:70px; padding:8px; border-radius:8px; border:1px solid var(--mut); background:var(--bg); color:var(--fg); font:inherit; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips button { border:1px solid var(--mut); background:transparent; color:var(--fg); border-radius:14px; padding:3px 10px; font-size:.78rem; cursor:pointer; }
  .send { margin-top:6px; padding:8px 14px; border:0; border-radius:8px; background:var(--err); color:#fff; cursor:pointer; }
  .status { margin-left:8px; font-size:.8rem; color:var(--mut); }
  details.prefs { padding:0 16px 24px; color:var(--mut); font-size:.85rem; } details.prefs summary { cursor:pointer; }
  .empty { padding:32px; text-align:center; color:var(--mut); }
</style>
</head>
<body>
<header><h1>✈️ Flight Deals</h1><span class="mut" id="upd">chargement…</span><button class="refuse" id="tok" title="Nécessaire pour envoyer un refus depuis cette page">🔑 Connecter GitHub</button></header>
<nav id="filters"></nav>
<main id="list"></main>
<details class="prefs"><summary>Mes réglages appris de mes refus</summary><div id="prefs">Aucun pour l'instant.</div></details>
<script>
const LABEL = {error_fare:"Erreur de prix", deal:"Très bonne affaire", business_deal:"Business", stopover_deal:"Montage d'escales"};
const AIR = {widebody_probable:"Gros-porteur probable", unverified:"⚠️ Avion à vérifier", not_required:"Vol court"};
let deals = [], filter = "all", refused = new Set(JSON.parse(localStorage.getItem("hidden") || "[]"));
const REASONS = ["Trop cher", "Séjour trop court", "Séjour trop long", "Trop loin", "Trop d'escales", "Destination déjà vue", "Avion pas adapté", "Trop touristique", "Billets séparés trop risqués"];
const REPO = location.hostname.endsWith("github.io") ? [location.hostname.split(".")[0], location.pathname.split("/")[1]] : ["gwendix44-dev", "flight-deals"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : "";

function render() {
  const el = document.getElementById("list");
  const rows = deals.filter(d => (filter === "all" || d.kind === filter) && !refused.has(d.issue));
  if (!rows.length) { el.innerHTML = '<div class="empty">Aucune affaire pour le moment. Le scanner tourne en continu.</div>'; return; }
  el.innerHTML = rows.map(d => { const o = d.offer, url = safeUrl(o.link); return `
    <article class="${esc(d.kind)}">
      <div class="tag">${esc(LABEL[d.kind])} ${d.score ? `<span class="score">${esc(d.score)}/11</span>` : ""}</div>
      <div><strong>${esc(o.origin)} → ${esc(d.dest_city)}</strong> <span class="mut">(${esc(d.country)})</span></div>
      <div class="price">${Math.round(o.price_eur)} €</div>
      <div class="tot">Séjour complet ≈ ${esc(d.trip_total)} € <span class="mut">(${esc(d.stay_days)} j, ${esc(d.daily_budget)} €/j)</span></div>
      <div class="mut">${esc(o.depart || "dates sur le lien")} → ${esc(o.return_date || "")} · ${esc(d.distance_km)} km · ~${esc(d.flight_hours)} h · ${o.transfers ? esc(o.transfers) + " escale(s)" : "direct"}</div>
      ${(d.cost_lines || []).length ? `<details class="costs"><summary>Détail du séjour (${esc(d.stay_cost)} € sur place)</summary>${d.cost_lines.map(l => `<div>${esc(l[0])} : <b>${esc(l[1])} €</b></div>`).join("")}</details>` : ""}
      ${d.verification ? `<div class="verif">✔ ${esc(d.verification)}</div>` : ""}
      ${d.score_line ? `<div class="grid">${esc(d.score_line)}</div>` : ""}
      ${d.saving_pct ? `<div class="mut">−${esc(d.saving_pct)} % vs billet classique (${Math.round(d.baseline_eur)} €)</div>` : ""}
      ${(d.itinerary || []).length ? `<div class="itin">${d.itinerary.map(x => `<div>${esc(x.replace(/https?:\/\/\S+/, "").trim())}</div>`).join("")}</div><div class="warn">Billets séparés : pas de protection en cas de retard</div>` : ""}
      <div class="${d.aircraft === "unverified" ? "warn" : "mut"}">${esc(AIR[d.aircraft] || d.aircraft)}</div>
      ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Voir l'offre</a>` : ""}<button class="refuse" data-act="open" data-k="${esc(d.key)}">👎 Refuser</button>
      <div class="rform" hidden data-form="${esc(d.key)}">
        <div class="chips">${REASONS.map(r => `<button data-act="chip" data-t="${esc(r)}">${esc(r)}</button>`).join("")}</div>
        <textarea placeholder="Explique pourquoi tu refuses (trop cher, séjour trop court, trop d'escales…)"></textarea>
        <button class="send" data-act="send" data-k="${esc(d.key)}">Envoyer le refus</button><span class="status"></span>
      </div>
    </article>`; }).join("");
}

async function sendRefusal(d, text, status) {
  if (!d.issue) { status.textContent = "Cette offre n'a pas d'Issue liée."; return; }
  const token = localStorage.getItem("ghtoken");
  if (!token) {
    try { await navigator.clipboard.writeText(text); } catch {}
    window.open(`https://github.com/${REPO[0]}/${REPO[1]}/issues/${d.issue}`, "_blank", "noopener");
    status.textContent = "Texte copié : colle-le en commentaire sur GitHub (ou connecte GitHub en haut).";
    return;
  }
  const r = await fetch(`https://api.github.com/repos/${REPO[0]}/${REPO[1]}/issues/${d.issue}/comments`, {
    method: "POST", headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ body: text }) });
  if (r.ok) { refused.add(d.issue); localStorage.setItem("hidden", JSON.stringify([...refused])); status.textContent = "Envoyé ✔ l'appli s'adapte."; setTimeout(render, 1200); }
  else status.textContent = `Échec (${r.status}) : vérifie ton token (droit Issues en écriture).`;
}
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const art = b.closest("article"), form = art.querySelector(".rform"), ta = form.querySelector("textarea");
  if (b.dataset.act === "open") form.hidden = !form.hidden;
  if (b.dataset.act === "chip") ta.value = (ta.value ? ta.value + ", " : "") + b.dataset.t.toLowerCase();
  if (b.dataset.act === "send") {
    const d = deals.find(x => x.key === b.dataset.k), text = ta.value.trim(), st = form.querySelector(".status");
    if (!text) { st.textContent = "Écris au moins une raison."; return; }
    sendRefusal(d, text, st);
  }
});
document.getElementById("tok").onclick = () => {
  const t = prompt("Colle ton token GitHub (fine-grained, uniquement ce dépôt, droit « Issues : Read and write »). Il reste dans ce navigateur.");
  if (t) { localStorage.setItem("ghtoken", t.trim()); alert("Token enregistré sur cet appareil."); }
};

function buildFilters() {
  const nav = document.getElementById("filters");
  nav.innerHTML = [["all","Tout"],["error_fare","Erreurs de prix"],["deal","Bonnes affaires"],["business_deal","Business"],["stopover_deal","Montages"]]
    .map(([k,l]) => `<button data-k="${k}" aria-pressed="${k===filter}">${l}</button>`).join("");
  nav.onclick = e => { const k = e.target.dataset.k; if (k) { filter = k; buildFilters(); render(); } };
}

async function load() {
  try {
    const r = await fetch("deals.json?t=" + Date.now()); const j = await r.json();
    deals = j.deals || [];
    document.getElementById("upd").textContent = j.updated ? "Dernier scan : " + new Date(j.updated).toLocaleString("fr-FR") : "Aucun scan";
    const seen = +localStorage.getItem("seen") || 0, latest = deals.length ? Date.parse(deals[0].found_at) : 0;
    if (latest > seen && seen && "Notification" in window && Notification.permission === "granted")
      new Notification("Flight Deals", { body: `${deals[0].offer.origin} → ${deals[0].dest_city} ${Math.round(deals[0].offer.price_eur)} €` });
    localStorage.setItem("seen", latest);
  } catch { document.getElementById("upd").textContent = "Impossible de charger les données"; }
  try {
    const p = await (await fetch("preferences.json?t=" + Date.now())).json();
    (p.refused_issues || []).forEach(n => refused.add(n));
    const rows = Object.entries(p).filter(([k, v]) => k !== "refused_issues" && v !== null && v !== false && v !== 0 && !(Array.isArray(v) && !v.length));
    document.getElementById("prefs").innerHTML = rows.length ? rows.map(([k, v]) => `<div>${esc(k)} : ${esc(Array.isArray(v) ? v.join(", ") : v)}</div>`).join("") : "Aucun pour l'instant.";
  } catch {}
  render();
}
buildFilters(); load(); setInterval(load, 5 * 60 * 1000);
if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>

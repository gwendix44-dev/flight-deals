<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1d33">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flight Deals">
<title>Flight Deals</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f7fa; --card:#fff; --fg:#10202f; --mut:#5b6b7b; --acc:#0b6bcb; --err:#c62828; --bus:#6a1b9a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1d33; --card:#132a45; --fg:#e8eef5; --mut:#9fb2c6; --acc:#5aa9ff; --err:#ff6b6b; --bus:#c58bff; } }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  h1 { margin:0; font-size:1.3rem; }
  .mut { color:var(--mut); font-size:.85rem; }
  nav { padding:0 16px 8px; display:flex; gap:8px; flex-wrap:wrap; }
  nav button { border:1px solid var(--mut); background:transparent; color:var(--fg); border-radius:20px; padding:6px 14px; cursor:pointer; }
  nav button[aria-pressed="true"] { background:var(--acc); border-color:var(--acc); color:#fff; }
  main { padding:8px 16px 32px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  article { background:var(--card); border-radius:12px; padding:14px; border-left:5px solid var(--acc); }
  article.error_fare { border-color:var(--err); } article.business_deal { border-color:var(--bus); } article.stopover_deal { border-color:#ef6c00; }
  .itin { font-size:.85rem; margin:6px 0; padding-left:10px; border-left:2px solid var(--mut); } .itin div { margin:2px 0; }
  .tag { font-size:.75rem; font-weight:700; text-transform:uppercase; }
  .error_fare .tag { color:var(--err); } .business_deal .tag { color:var(--bus); } .stopover_deal .tag { color:#ef6c00; }
  .score { float:right; background:var(--acc); color:#fff; border-radius:12px; padding:2px 10px; font-size:.85rem; }
  .grid { font-size:.78rem; color:var(--mut); margin-top:4px; }
  details.costs { font-size:.85rem; margin:6px 0; } details.costs div { margin:2px 0 2px 10px; }
  .verif { font-size:.8rem; color:#2e7d32; margin:4px 0; }
  .price { font-size:1.6rem; font-weight:700; } .tot { font-weight:600; }
  .warn { color:#b26a00; font-size:.85rem; } a.btn { display:inline-block; margin-top:8px; padding:8px 14px; background:var(--acc); color:#fff; border-radius:8px; text-decoration:none; }
  .refuse { margin-left:8px; padding:8px 12px; border-radius:8px; border:1px solid var(--mut); background:transparent; color:var(--fg); cursor:pointer; }
  .rform { margin-top:10px; } .rform[hidden] { display:none; }
  .rform textarea { width:100%; box-sizing:border-box; min-height:70px; padding:8px; border-radius:8px; border:1px solid var(--mut); background:var(--bg); color:var(--fg); font:inherit; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips button { border:1px solid var(--mut); background:transparent; color:var(--fg); border-radius:14px; padding:3px 10px; font-size:.78rem; cursor:pointer; }
  .send { margin-top:6px; padding:8px 14px; border:0; border-radius:8px; background:var(--err); color:#fff; cursor:pointer; }
  .status { margin-left:8px; font-size:.8rem; color:var(--mut); }
  details.prefs { padding:0 16px 24px; color:var(--mut); font-size:.85rem; } details.prefs summary { cursor:pointer; }
  .status-line { margin:0 16px 10px; padding:8px 12px; border-radius:10px; font-size:.82rem; background:var(--card); color:var(--mut); }
  .status-line.bad { background:#fdecea; color:#b71c1c; } .status-line.ok b { color:#2e7d32; }
  .slotbadge { font-size:.72rem; background:var(--bg); color:var(--mut); border-radius:10px; padding:2px 8px; margin-left:6px; }
  #pending button { margin:6px 6px 0 0; } #pending { white-space:normal; }
  .tier-bon_plan { border-left-color:#9e9e9e !important; opacity:.96; }
  nav[hidden] { display:none; }
  #sections { padding:0 16px 8px; display:flex; gap:10px; } #sections button { flex:1; padding:12px; border-radius:12px; border:2px solid var(--mut); background:transparent; color:var(--fg); font-weight:600; cursor:pointer; }
  #sections button[aria-pressed="true"] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  article.biz .price small { font-size:.9rem; font-weight:400; color:var(--mut); }
  .empty { padding:32px; text-align:center; color:var(--mut); }
</style>
</head>
<body>
<header><h1>✈️ Flight Deals</h1><span class="mut" id="upd">chargement…</span><button class="refuse" id="ntf">🔔 Notifications</button><button class="refuse" id="tok" title="Nécessaire pour envoyer un refus depuis cette page">🔑 Connecter GitHub</button></header>
<div id="toast" class="status-line ok" hidden style="position:sticky;top:0;z-index:5"></div>
<div id="pushpanel" class="status-line" hidden>
  <div id="pushmsg"></div>
  <button class="send" id="pushgo" style="background:var(--acc)">🔔 Activer les notifications</button>
  <textarea id="pushsub" readonly hidden style="width:100%;box-sizing:border-box;min-height:90px;margin-top:8px;font-size:.7rem"></textarea>
  <button class="refuse" id="pushcopy" hidden style="margin:6px 0 0 0">Copier le texte</button>
</div>
<div id="pending" class="status-line bad" hidden></div>
<div id="status" class="status-line">…</div>
<details id="statusmore" class="prefs" hidden><summary>Pourquoi pas plus d'offres ? (détails du dernier scan)</summary><div id="statusmore-body"></div></details>
<nav id="sections"></nav>
<nav id="filters"></nav>
<main id="list"></main>
<details class="prefs"><summary>Mes réglages appris de mes refus</summary><div id="prefs">Aucun pour l'instant.</div></details>
<script>
const LABEL = {error_fare:"Erreur de prix", deal:"Très bonne affaire", business_deal:"Business", stopover_deal:"Montage d'escales"};
const AIR = {widebody_probable:"Gros-porteur probable", unverified:"⚠️ Avion à vérifier", not_required:"Vol court"};
let deals = [], filter = "all", section = "voyage", refused = new Set(JSON.parse(localStorage.getItem("hidden") || "[]"));
let hiddenKeys = new Set(JSON.parse(localStorage.getItem("hiddenKeys") || "[]")), refusedKeys = new Set(), pending = JSON.parse(localStorage.getItem("pendingRefusals") || "[]");
const gone = d => hiddenKeys.has(d.key) || refusedKeys.has(d.key) || refused.has(d.issue);       // refusée = supprimée, immédiatement
const isBP = d => d.tier === "bon_plan";
const REASONS = ["Trop cher", "Séjour trop court", "Séjour trop long", "Trop loin", "Trop d'escales", "Destination déjà vue", "Avion pas adapté", "Trop touristique", "Billets séparés trop risqués"];
const REPO = location.hostname.endsWith("github.io") ? [location.hostname.split(".")[0], location.pathname.split("/")[1]] : ["gwendix44-dev", "flight-deals"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : "";

function render() {
  const el = document.getElementById("list");
  const rows = deals.filter(d => !gone(d) && (section === "business"
    ? d.kind === "business_deal"
    : d.kind !== "business_deal" && (filter === "all" || (filter === "pepite" ? !isBP(d) : filter === "bon_plan" ? isBP(d) : d.kind === filter))));
  if (!rows.length) { el.innerHTML = section === "business"
    ? '<div class="empty">Aucun très bon deal business pour le moment (A/R ≤ 800 €, long-courrier). Le scanner tourne en continu.</div>'
    : '<div class="empty">Aucune offre à afficher pour le moment. Ouvre « Pourquoi pas plus d\'offres ? » plus bas pour voir ce que le dernier scan a trouvé.</div>'; return; }
  el.innerHTML = rows.map(d => { const o = d.offer, url = safeUrl(o.link); return `
    <article class="${esc(d.kind)} ${d.kind === "business_deal" ? "biz" : ""} tier-${esc(d.tier || "pepite")}">
      <div class="tag">${isBP(d) ? "👀 Bon plan (7 à 8/10)" : esc(LABEL[d.kind])}${d.slot ? `<span class="slotbadge">${esc(d.slot)}</span>` : ""} ${d.score ? `<span class="score">${esc(d.score)}/11</span>` : ""}</div>
      <div><strong>${esc(o.origin)} → ${esc(d.dest_city)}</strong> <span class="mut">(${esc(d.country)})</span></div>
      <div class="price">${Math.round(d.kind === "business_deal" ? o.price_eur : (d.flight_all_in || o.price_eur))} € ${d.kind === "business_deal" ? "<small>A/R en business</small>" : "<small>bagages inclus</small>"}</div>
      ${d.bag_supplement ? `<div class="mut">tarif affiché ${Math.round(o.price_eur)} € + supplément bagages estimé ${Math.round(d.bag_supplement)} €</div>` : ""}
      ${d.bag_note ? `<div class="${["inclus","probable"].includes(d.bag_status) ? "mut" : "warn"}">🎒 ${esc(d.bag_note)}</div>` : ""}
      ${d.kind === "business_deal"
        ? `<div class="mut">Prix du séjour non pris en compte (indicatif : ≈ ${esc(d.stay_cost)} € sur place)</div>`
        : `<div class="tot">Séjour complet ≈ ${esc(d.trip_total)} € <span class="mut">(${esc(d.stay_days)} j, ${esc(d.daily_budget)} €/j)</span></div>`}
      <div class="mut">${esc(o.depart || "dates sur le lien")} → ${esc(o.return_date || "")} · ${esc(d.distance_km)} km · ~${esc(d.flight_hours)} h · ${o.transfers ? esc(o.transfers) + " escale(s)" : "direct"}</div>
      ${(d.cost_lines || []).length ? `<details class="costs"><summary>Détail du séjour (${esc(d.stay_cost)} € sur place)</summary>${d.cost_lines.map(l => `<div>${esc(l[0])} : <b>${esc(l[1])} €</b></div>`).join("")}</details>` : ""}
      ${d.verification ? `<div class="verif">${/^[✔⚠]/.test(d.verification) ? "" : "✔ "}${esc(d.verification)}</div>` : ""}
      ${d.score_line ? `<div class="grid">${esc(d.score_line)}</div>` : ""}
      ${d.saving_pct ? `<div class="mut">−${esc(d.saving_pct)} % vs billet classique (${Math.round(d.baseline_eur)} €)</div>` : ""}
      ${(d.itinerary || []).length ? `<div class="itin">${d.itinerary.map(x => `<div>${esc(x.replace(/https?:\/\/\S+/, "").trim())}</div>`).join("")}</div><div class="warn">Billets séparés : pas de protection en cas de retard</div>` : ""}
      <div class="${d.aircraft === "unverified" ? "warn" : "mut"}">${esc(AIR[d.aircraft] || d.aircraft)}</div>
      ${safeUrl((d.links || {}).google_flights) ? `<a class="btn" href="${esc(d.links.google_flights)}" target="_blank" rel="noopener noreferrer">1 · Vérifier en direct</a>` : ""}
      ${safeUrl((d.links || {}).airline_site) ? `<a class="btn" style="background:#2e7d32" href="${esc(d.links.airline_site)}" target="_blank" rel="noopener noreferrer">2 · Site de ${esc(d.links.airline_name || "la compagnie")}</a>` : ""}
      ${(d.links || {}).google_flights_legs ? d.links.google_flights_legs.map((u, i) => safeUrl(u) ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Vérifier billet ${i + 1}</a>` : "").join(" ") : ""}
      ${url ? `<a class="mut" style="margin-left:6px;font-size:.78rem" href="${esc(url)}" target="_blank" rel="noopener noreferrer">source du prix</a>` : ""}<button class="refuse" data-act="open" data-k="${esc(d.key)}">👎 Refuser</button>
      <div class="rform" hidden data-form="${esc(d.key)}">
        <div class="chips">${REASONS.map(r => `<button data-act="chip" data-t="${esc(r)}">${esc(r)}</button>`).join("")}</div>
        <textarea placeholder="Explique pourquoi tu refuses (trop cher, séjour trop court, trop d'escales…)"></textarea>
        <button class="send" data-act="send" data-k="${esc(d.key)}">Envoyer le refus</button><span class="status"></span>
      </div>
    </article>`; }).join("");
}

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 9000); }
function refusalIssue(d, text) {
  return { title: `Refus : ${d.offer.origin}→${d.dest_city}`, body: `deal:${d.key}\nissue:${d.issue || ""}\n---\n${text}` };
}
const newIssueUrl = r => `https://github.com/${REPO[0]}/${REPO[1]}/issues/new?title=${encodeURIComponent(r.title)}&body=${encodeURIComponent(r.body)}`;
function renderPending() {
  const el = document.getElementById("pending");
  pending = pending.filter(r => !refusedKeys.has(r.key));                    // déjà pris en compte par l'appli : plus rien à faire
  localStorage.setItem("pendingRefusals", JSON.stringify(pending));
  if (!pending.length) { el.hidden = true; return; }
  const todo = pending.filter(r => !r.opened), doing = pending.filter(r => r.opened);
  el.hidden = false; el.className = "status-line " + (todo.length ? "bad" : "ok");
  el.innerHTML = (doing.length ? `⏳ <b>${doing.length} refus en cours de prise en compte</b> (1 à 2 minutes). Cette ligne disparaît toute seule : rien à faire, ne retouche pas « Valider ».` : "") +
    (todo.length ? `<div style="margin-top:6px">⚠ <b>${todo.length} refus à valider</b> : l'offre est masquée ici, mais ta raison n'est prise en compte qu'après avoir touché « Valider », puis le bouton vert « Create » sur la page GitHub.</div>` +
      pending.map((r, i) => r.opened ? "" : `<button class="send" data-pend="${i}">Valider « ${esc(r.title.replace("Refus : ", ""))} »</button>`).join("") : "");
}
function markOpened(r) {
  r.opened = true; localStorage.setItem("pendingRefusals", JSON.stringify(pending)); renderPending();
  setTimeout(load, 70 * 1000); setTimeout(load, 130 * 1000); setTimeout(load, 240 * 1000);       // le robot a besoin d'1 à 2 min
}
document.getElementById("pending").addEventListener("click", e => {
  const i = e.target.dataset.pend; if (i === undefined) return;
  window.open(newIssueUrl(pending[+i]), "_blank", "noopener");
  markOpened(pending[+i]);
});
async function sendRefusal(d, text) {
  const r = { ...refusalIssue(d, text), key: d.key };
  // 1) l'offre est SUPPRIMÉE tout de suite de l'écran, quoi qu'il arrive ensuite
  hiddenKeys.add(d.key); localStorage.setItem("hiddenKeys", JSON.stringify([...hiddenKeys]));
  pending.push(r); localStorage.setItem("pendingRefusals", JSON.stringify(pending));
  buildFilters(); render(); renderPending();
  // 2) envoi : direct avec un jeton, sinon page GitHub déjà remplie (un seul bouton à toucher, aucun compte à créer)
  const token = localStorage.getItem("ghtoken");
  if (!token) {
    window.open(newIssueUrl(r), "_blank", "noopener");                       // appelé dans le geste de l'utilisateur : pas bloqué
    toast("Offre supprimée. Dernière étape : sur la page GitHub qui s'ouvre, touche le bouton vert « Create », puis reviens ici.");
    markOpened(r);
    return;
  }
  try {
    const resp = await fetch(`https://api.github.com/repos/${REPO[0]}/${REPO[1]}/issues`, {
      method: "POST", headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ title: r.title, body: r.body }) });
    if (resp.ok) { toast("Refus envoyé ✔ : l'offre est supprimée et ta raison sera prise en compte aux prochains scans."); markOpened(r); }
    else toast(`Offre masquée, mais l'envoi a échoué (${resp.status}) : vérifie ton jeton, ou valide le refus avec le bouton orange.`);
  } catch { toast("Offre masquée, mais pas de connexion : le refus sera à valider avec le bouton orange."); }
}
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const art = b.closest("article"), form = art.querySelector(".rform"), ta = form.querySelector("textarea");
  if (b.dataset.act === "open") form.hidden = !form.hidden;
  if (b.dataset.act === "chip") ta.value = (ta.value ? ta.value + ", " : "") + b.dataset.t.toLowerCase();
  if (b.dataset.act === "send") {
    const d = deals.find(x => x.key === b.dataset.k), text = ta.value.trim(), st = form.querySelector(".status");
    if (!text) { st.textContent = "Écris au moins une raison."; return; }
    sendRefusal(d, text);
  }
});
document.getElementById("tok").onclick = () => {
  const t = prompt("Colle ton token GitHub (fine-grained, uniquement ce dépôt, droit « Issues : Read and write »). Il reste dans ce navigateur.");
  if (t) { localStorage.setItem("ghtoken", t.trim()); alert("Token enregistré sur cet appareil."); }
};

function buildFilters() {
  const nb = deals.filter(d => d.kind === "business_deal" && !gone(d)).length;
  const nv = deals.filter(d => d.kind !== "business_deal" && !gone(d)).length;
  const sec = document.getElementById("sections");
  sec.innerHTML = `<button data-s="voyage" aria-pressed="${section === "voyage"}">✈️ Deals voyage (${nv})</button>
                   <button data-s="business" aria-pressed="${section === "business"}">💺 Business class (${nb})</button>`;
  sec.onclick = e => { const k = e.target.dataset.s; if (k) { section = k; buildFilters(); render(); } };
  const nav = document.getElementById("filters");
  nav.hidden = section === "business";
  nav.innerHTML = [["all","Tout"],["pepite","⭐ Pépites"],["bon_plan","👀 Bons plans"],["error_fare","Erreurs de prix"],["stopover_deal","Montages"]]
    .map(([k,l]) => `<button data-k="${k}" aria-pressed="${k===filter}">${l}</button>`).join("");
  nav.onclick = e => { const k = e.target.dataset.k; if (k) { filter = k; buildFilters(); render(); } };
}

let useApi = new URLSearchParams(location.search).has("fresh");    // ouvert depuis une notification
async function fetchJSON(name, forceApi = false) {
  if (useApi || forceApi) {
    try {                                                           // GitHub API : à jour dès le commit du robot, sans le délai de Pages
      const r = await fetch(`https://api.github.com/repos/${REPO[0]}/${REPO[1]}/contents/docs/${name}?ref=main`,
        { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
      if (r.ok) return await r.json();
    } catch {}
  }
  return await (await fetch(name + "?t=" + Date.now(), { cache: "no-store" })).json();
}

async function renderStatus() {
  const el = document.getElementById("status");
  try {
    const st = await fetchJSON("status.json");
    const t = st.updated ? new Date(st.updated) : null, age = t ? (Date.now() - t.getTime()) / 60000 : 1e9;
    const hh = x => new Date(x).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const ls = st.last_slot ? ` · dernière publication : ${st.last_slot.label.replace("Publication de ", "")} (${st.last_slot.standard} deal(s) + ${st.last_slot.business} business)` : "";
    const base = `${st.offers ? Number(st.offers).toLocaleString("fr-FR") + " offres analysées · " : ""}${st.waiting ?? 0} en attente · prochaine publication ${st.next_slot || "12h / 19h"}${ls}${st.live_active ? " · prix en direct : actif (" + st.live_used + "/" + st.live_budget + " ce mois)" : ""}`;
    const more = document.getElementById("statusmore"), body = document.getElementById("statusmore-body");
    const lines = [];
    if (st.last_slot) lines.push(`<div><b>Dernier créneau (${esc(st.last_slot.label.replace("Publication de ", ""))})</b> : ${esc(st.last_slot.standard)} pépite(s), ${esc(st.last_slot.business)} business, ${esc(st.last_slot.bons_plans ?? 0)} bon(s) plan(s).</div>`);
    if ((st.best_missed || []).length) lines.push(`<div style="margin-top:6px"><b>Meilleures offres du dernier scan, sous le seuil de 8/10 :</b></div>` + st.best_missed.map(x => `<div>• ${esc(x)}</div>`).join(""));
    if ((st.rejets || []).length) lines.push(`<div style="margin-top:6px"><b>Offres écartées par la revérification des prix :</b></div>` + st.rejets.map(x => `<div>• ${esc(x)}</div>`).join(""));
    more.hidden = !lines.length; body.innerHTML = lines.join("");
    if (!st.ok || age > 90) {
      el.className = "status-line bad";
      el.textContent = (!st.ok ? "🔴 Problème au dernier scan : " + (st.errors || []).join(" ; ") + ". " : "🟠 Pas de scan depuis " + Math.round(age) + " min. ") + base;
    } else {
      el.className = "status-line ok";
      el.innerHTML = `<b>🟢 L'appli tourne</b> (scan de ${esc(hh(st.updated))}) · ` + esc(base);
    }
  } catch { el.className = "status-line"; el.textContent = "État du scan indisponible"; }
}

async function load() {
  try {
    const j = await fetchJSON("deals.json");
    deals = j.deals || [];
    document.getElementById("upd").textContent = j.updated ? "Dernier scan : " + new Date(j.updated).toLocaleString("fr-FR") : "Aucun scan";
    const seen = +localStorage.getItem("seen") || 0, latest = deals.length ? Date.parse(deals[0].found_at) : 0;
    if (latest > seen && seen && "Notification" in window && Notification.permission === "granted")
      new Notification("Flight Deals", { body: `${deals[0].offer.origin} → ${deals[0].dest_city} ${Math.round(deals[0].offer.price_eur)} €` });
    localStorage.setItem("seen", latest);
  } catch { document.getElementById("upd").textContent = "Impossible de charger les données"; }
  try {
    const p = await fetchJSON("preferences.json", pending.length > 0);     // refus en attente : lecture directe, sans le délai du site
    (p.refused_issues || []).forEach(n => refused.add(n));
    refusedKeys = new Set(p.refused_keys || []);
    const rows = Object.entries(p).filter(([k, v]) => !["refused_issues", "refused_keys"].includes(k) && v !== null && v !== false && v !== 0 && !(Array.isArray(v) && !v.length));
    document.getElementById("prefs").innerHTML = rows.length ? rows.map(([k, v]) => `<div>${esc(k)} : ${esc(Array.isArray(v) ? v.join(", ") : v)}</div>`).join("") : "Aucun pour l'instant.";
  } catch {}
  buildFilters(); render(); renderPending(); renderStatus();
}
buildFilters(); load(); setInterval(load, 2 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });   // retour sur l'appli = données fraîches
window.addEventListener("focus", load);

// ---------- Notifications natives (Web Push) : aucune appli externe, tout passe par ce raccourci ----------
const VAPID_PUBLIC = "BKH9qc1jDaLuszDQqgLSNQ4FDDbhJitb_ycqO_F_PxhQjp3S_fQfVaVXSFuM80AaT6-oUQ2OtVju0lL06Moq2Tc";
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
const b64ToBytes = b => { const s = (b + "=".repeat((4 - b.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"), r = atob(s); return Uint8Array.from(r, c => c.charCodeAt(0)); };
const pmsg = document.getElementById("pushmsg"), pbox = document.getElementById("pushsub"), pcopy = document.getElementById("pushcopy");

function showSub(sub) {
  pbox.value = JSON.stringify(sub.toJSON()); pbox.hidden = false; pcopy.hidden = false;
  pmsg.innerHTML = "✔ Notifications <b>activées sur cet appareil</b>.<br><b>Dernière étape (une seule fois)</b> : copie le texte ci-dessous et colle-le dans le secret GitHub <code>PUSH_SUBSCRIPTION</code> (Settings &gt; Secrets and variables &gt; Actions).";
}
async function pushState() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    pmsg.textContent = isIOS && !standalone
      ? "Sur iPhone : ajoute d'abord l'appli à l'écran d'accueil (bouton Partager, puis « Sur l'écran d'accueil »), puis ouvre-la depuis son icône et reviens ici."
      : "Ce navigateur ne gère pas les notifications. Ouvre l'appli dans Chrome (Android) ou depuis l'icône de l'écran d'accueil (iPhone).";
    document.getElementById("pushgo").hidden = true; return;
  }
  const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === "granted") { showSub(sub); document.getElementById("pushgo").textContent = "Réactiver"; }
  else if (Notification.permission === "denied") pmsg.textContent = "Les notifications sont bloquées pour ce site : autorise-les dans les réglages du téléphone, puis reviens ici.";
  else pmsg.textContent = "Notifications désactivées sur cet appareil.";
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();                       // doit venir d'un tap : c'est le cas ici
    if (perm !== "granted") { pmsg.textContent = "Autorisation refusée. Autorise les notifications pour ce site dans les réglages du téléphone."; return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    showSub(sub);
  } catch (e) { pmsg.textContent = "Impossible d'activer les notifications : " + e.message; }
}
document.getElementById("ntf").onclick = () => { const p = document.getElementById("pushpanel"); p.hidden = !p.hidden; if (!p.hidden) pushState(); };
document.getElementById("pushgo").onclick = enablePush;
pcopy.onclick = async () => { try { await navigator.clipboard.writeText(pbox.value); pcopy.textContent = "Copié ✔"; } catch { pbox.select(); pcopy.textContent = "Sélectionné : copie-le à la main"; } };
// Une notification vient d'arriver : relecture immédiate des données (sans attendre le déploiement de la page), puis une 2e fois.
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => {
  if (e.data && e.data.type === "refresh") { useApi = true; load(); setTimeout(() => { useApi = false; load(); }, 90 * 1000); }
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
